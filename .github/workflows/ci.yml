name: CI

# Runs on every push (any branch), every pull request, and manually.
# Public repository: free, unlimited minutes. Private: 2,000 free
# minutes per month - three parallel jobs use more minutes than one.
#
# STRUCTURE:
#   verify      - typecheck + lint + format
#   e2e         - Playwright + axe, builds its own app (webServer)
#   Lighthouse  - moved 2026-11-04 to lighthouse.yml, where it runs against
#                 the Vercel preview deployment instead of a local build.
#
# The jobs are deliberately independent (no `needs:`): E2E must not be
# skipped or masked by a Lighthouse result, or vice versa. Each gate reports
# its own verdict on every run.
#
# THRESHOLDS: see lighthouserc.js (read by lighthouse.yml).
#
# GITHUB_TOKEN: the deployment token lives only in Vercel. It is never
# passed to these jobs, their build steps, or their logs, and no job here
# needs it (the GitHub API route is force-dynamic and falls back to
# unauthenticated requests when the token is absent). Checkout uses the
# run's ephemeral token with `persist-credentials: false` so no credential
# is written into the local git config either.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails fast on style drift.
      - name: Format check
        run: npm run format:check

  e2e:
    name: Playwright + axe
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # NO separate Build step here: playwright.config.ts owns the server,
      # so the suite always runs against a build made for THIS run. It
      # never reuses a stale server (stale-build reuse produced invalid
      # evidence earlier in this project), which is why
      # `reuseExistingServer` is false even locally.
      - name: E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
